# Alembic 配置 — schema 版本管理
#
# 关键设计：
# - script_location = alembic（相对 backend/，运行 alembic 命令时 cwd 必须是 backend/）
# - prepend_sys_path = .（让 env.py 能 `from core.xxx import` 解析到 backend/core/）
# - sqlalchemy.url 留空 — env.py 在运行时从 core.paths.DATABASE_PATH 派生 sync URL，
#   避免双真理源（alembic.ini 写死 URL 会跟 core/paths.py 漂移）
# - target_metadata / compare_type 等高级配置在 env.py 中（ini 不支持复杂 Python 表达式）
#
# 使用方式（cwd 必须是 backend/）：
#   cd backend && <python> -m alembic upgrade head      # 升级到最新
#   cd backend && <python> -m alembic current           # 查看当前版本
#   cd backend && <python> -m alembic history           # 查看迁移历史
#   cd backend && <python> -m alembic revision -m "xxx" # 手写新 migration
#   cd backend && <python> -m alembic revision --autogenerate -m "xxx"
#
# 生产启动时由 sidecar.py:init_db() 编程式调用 alembic.command.upgrade(cfg, "head")，
# 不走命令行（避免 subprocess + cwd 依赖）。

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os
timezone = UTC

# 文件名模板：年月日时分-revision-slug（人类可读 + 时间排序）
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

output_encoding = utf-8

# sqlalchemy.url 留空（env.py 派生）
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
