[package]
name = "clipboard-manager"
version = "1.0.0"
description = "Clipboard Manager — 轻量常驻的剪贴板历史管理工具"
authors = ["Template"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["macos-private-api"] }
tauri-plugin-log = "2"
# tokio: 保留 rt-multi-thread/macros/sync/time。
# 删 process(sidecar spawn 专用,已无子进程)/fs/io-util。
# ❌ 禁止引 fs feature:文件 IO 走 spawn_blocking(constraints.md)
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time"] }

[features]
# 默认特性
default = []
