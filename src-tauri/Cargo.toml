[package]
name = "clipboard-manager"
version = "1.0.0"
description = "Tauri 2 + React + Python FastAPI sidecar 通用工程模板"
authors = ["Template"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time", "process", "fs", "io-util"] }
dirs = "5"
thiserror = "1"

[features]
# 默认特性
default = []
