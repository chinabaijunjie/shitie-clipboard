[package]
name = "clipboard-manager"
version = "1.0.3"
description = "拾贴 — 轻量常驻的剪贴板历史管理工具"
authors = ["Template"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
# tokio: 保留 rt-multi-thread/macros/sync/time。
# 删 process(sidecar spawn 专用,已无子进程)/fs/io-util。
# ❌ 禁止引 fs feature:文件 IO 走 spawn_blocking(constraints.md)
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time"] }

# M1 spike:剪贴板读写 + 监听。image feature 启用 ContentFormat::Image / ClipboardContent::Image。
# 选型决策见 wiki/dev/m1-research.md。
clipboard-rs = { version = "0.3", features = ["image"] }

# M1 存储:rusqlite。bundled = 静态编译 SQLite,不依赖系统 libsqlite3(桌面应用跨机一致)。
# migration:M1 用手写 CREATE TABLE IF NOT EXISTS(幂等);长期演进再引 rusqlite_migration。
rusqlite = { version = "0.31", features = ["bundled"] }

# M2 图片存储:sha256 做图片文件名(天然去重,Raycast 生产验证方案)。
# RustCrypto 维护,生态最标准的 SHA256 实现。
sha2 = "0.10"
# M4 敏感信息过滤:正则匹配 API key/token/私钥(显式声明,虽已通过传递依赖存在)。
regex = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"

[features]
# 默认特性
default = []

[dev-dependencies]
# M2 测试用:生成合法 PNG 字节测 image_store(clipboard-rs 依赖的 image 同版本,复用)。
image = "0.25"
